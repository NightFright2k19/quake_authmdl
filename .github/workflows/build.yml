name: Build Authentic Models for Quake (Autobuild)

on:
  push:
    branches:
      - master
    paths:
      - 'id1/**'
      - 'hipnotic/**'
      - 'rogue/**'
      - 'mg3/**'
      - 'NOTICE.txt'
      - 'auth_mdl.txt'
      - 'todo_list.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quake-authmdl-autobuild
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      BUILD_NUM: ${{ github.run_number }}
      QPAKMAN_COMMIT: d8a0014bacb462d21b52d3bf66d01875a30ce9ab

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libpng-dev \
            unzip \
            zip

      - name: Build qpakman
        run: |
          QPAKMAN_DIR="$(mktemp -d)"
          trap 'rm -rf "$QPAKMAN_DIR"' EXIT

          git clone --depth 1 https://github.com/bunder/qpakman.git "$QPAKMAN_DIR/source"
          git -C "$QPAKMAN_DIR/source" fetch --depth 1 origin "$QPAKMAN_COMMIT"
          git -C "$QPAKMAN_DIR/source" checkout --detach "$QPAKMAN_COMMIT"

          cmake -S "$QPAKMAN_DIR/source" -B "$QPAKMAN_DIR/build"
          cmake --build "$QPAKMAN_DIR/build" --parallel

          mapfile -t qpakman_candidates < <(
            find "$QPAKMAN_DIR/build" -type f -executable -name qpakman
          )

          if [ "${#qpakman_candidates[@]}" -ne 1 ]; then
            printf 'ERROR: Expected exactly one qpakman executable, found %s.\n' \\
              "${#qpakman_candidates[@]}"
            printf '%s\n' "${qpakman_candidates[@]}"
            exit 1
          fi

          echo "QPAKMAN=${qpakman_candidates[0]}" >> "$GITHUB_ENV"

      - name: Create Quake PAK files
        env:
          QPAKMAN: ${{ env.QPAKMAN }}
        run: |
          declare -A INPUTS=(
            [id1]='maps progs'
            [hipnotic]='progs'
            [rogue]='maps progs'
            [mg3]='progs'
          )

          for dir in id1 hipnotic rogue mg3; do
            echo "Creating $dir/pakz.pak..."

            if [ ! -d "$dir" ]; then
              echo "ERROR: Directory '$dir' does not exist."
              exit 1
            fi

            read -r -a sources <<< "${INPUTS[$dir]}"
            for source in "${sources[@]}"; do
              if [ ! -d "$dir/$source" ]; then
                echo "ERROR: Required directory '$dir/$source' does not exist."
                exit 1
              fi
            done

            source_count=$(find "${sources[@]/#/$dir/}" -type f | wc -l)
            if [ "$source_count" -eq 0 ]; then
              echo "ERROR: No source files found for $dir."
              exit 1
            fi

            rm -f "$dir/pakz.pak"

            (
              cd "$dir"
              "$QPAKMAN" "${sources[@]}" -o pakz.pak
            )

            if [ ! -f "$dir/pakz.pak" ]; then
              echo "ERROR: Failed to create $dir/pakz.pak"
              exit 1
            fi

            pak_size=$(stat -c '%s' "$dir/pakz.pak")
            if [ "$pak_size" -le 12 ]; then
              echo "ERROR: $dir/pakz.pak contains no files (size: $pak_size bytes)."
              exit 1
            fi

            echo "Created $dir/pakz.pak ($pak_size bytes)"
          done

      - name: Prepare release package
        run: |
          PACKAGE_DIR="$GITHUB_WORKSPACE/package"
          ZIP_NAME="auth_mdl-autobuild_r${BUILD_NUM}.zip"

          rm -rf "$PACKAGE_DIR" "$ZIP_NAME"
          mkdir -p "$PACKAGE_DIR"/id1 "$PACKAGE_DIR"/hipnotic "$PACKAGE_DIR"/rogue "$PACKAGE_DIR"/mg3

          cp id1/pakz.pak "$PACKAGE_DIR/id1/"
          cp hipnotic/pakz.pak "$PACKAGE_DIR/hipnotic/"
          cp rogue/pakz.pak "$PACKAGE_DIR/rogue/"
          cp mg3/pakz.pak "$PACKAGE_DIR/mg3/"
          cp NOTICE.txt auth_mdl.txt todo_list.txt "$PACKAGE_DIR/"

          (
            cd "$PACKAGE_DIR"
            zip -9 -r "../$ZIP_NAME" \
              id1/pakz.pak \
              hipnotic/pakz.pak \
              rogue/pakz.pak \
              mg3/pakz.pak \
              NOTICE.txt \
              auth_mdl.txt \
              todo_list.txt
          )

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=autobuild-r${BUILD_NUM}" >> "$GITHUB_ENV"

      - name: Verify ZIP contents
        env:
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          unzip -t "$ZIP_NAME"
          unzip -l "$ZIP_NAME"

          EXPECTED=(
            "id1/pakz.pak"
            "hipnotic/pakz.pak"
            "rogue/pakz.pak"
            "mg3/pakz.pak"
            "NOTICE.txt"
            "auth_mdl.txt"
            "todo_list.txt"
          )

          mapfile -t actual < <(unzip -Z1 "$ZIP_NAME")
          if [ "${#actual[@]}" -ne "${#EXPECTED[@]}" ]; then
            echo "ERROR: ZIP contains unexpected files."
            printf 'Expected:\n%s\n' "${EXPECTED[@]}"
            printf 'Actual:\n%s\n' "${actual[@]}"
            exit 1
          fi

          for file in "${EXPECTED[@]}"; do
            if ! printf '%s\n' "${actual[@]}" | grep -Fxq "$file"; then
              echo "ERROR: Missing $file from ZIP."
              exit 1
            fi
          done

      - name: Create GitHub pre-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: Autobuild r${{ env.BUILD_NUM }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: ${{ env.ZIP_NAME }}
          body: |
            This "Authentic Models for Quake" release has been generated by an automated workflow script.

            **IMPORTANT:**
            Work-in-progress release. Not sufficiently tested and may contain unfinished assets. Use at your own risk!

      - name: Delete older Autobuild releases
        env:
          CURRENT_TAG: ${{ env.TAG_NAME }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = process.env.CURRENT_TAG;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            for (const release of releases) {
              if (
                release.prerelease &&
                release.tag_name.startsWith("autobuild-r") &&
                release.tag_name !== currentTag
              ) {
                console.log(`Deleting older autobuild release ${release.tag_name}: ${release.html_url}`);

                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });

                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`Deleted tag ${release.tag_name}`);
                } catch (error) {
                  console.log(`Could not delete tag ${release.tag_name}: ${error.message}`);
                }
              }
            }